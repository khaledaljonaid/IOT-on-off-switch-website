<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- ADD THIS LINE FOR MOBILE RESPONSIVENESS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>ESP32 Control</title>
    <!-- Working MQTT CDN -->
    <script src="https://cdn.jsdelivr.net/npm/paho-mqtt@1.1.0/paho-mqtt.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <img style="width: 200px;" src="Screenshot_2026-07-18_220821-removebg-preview.png" alt="logo">
        </div>
        <button id="logoutBtn" onclick="logout()" style="display: none;">Sign Out</button>
    </header>

    <!-- 1. CLIENT SIGN-IN SECTION -->
    <div id="loginSection">
        <h1>Sign In</h1>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required><br>
            <input type="password" id="loginPassword" placeholder="Password" required><br>
            <button type="submit" class="authBtn">Login</button>
        </form>
        <p id="loginErrorMsg" class="error-text" style="display: none;">Invalid credentials!</p>
        <p class="toggle-text"><span onclick="showOwnerPanel()">Owner Portal</span></p>
    </div>

    <!-- 2. OWNER / ADMIN PANEL (Hidden from clients) -->
    <div id="ownerSection" style="display: none;">
        <h1>Owner Dashboard</h1>
        
        <!-- Admin Key Input -->
        <div id="adminAuthBox">
            <input type="password" id="adminKeyInput" placeholder="Enter Owner Secret Key"><br>
            <button class="authBtn" onclick="verifyAdminKey()">Access Admin Panel</button>
            <p id="adminAuthError" class="error-text" style="display: none;"></p>
        </div>

        <!-- Management Area (shown after entering valid Admin Key) -->
        <div id="adminControls" style="display: none;">
            
            <div class="forms-wrapper">
                
                <div class="form-card">
                    <h2>Add New Client Account</h2>
                    <form id="adminAddForm">
                        <input type="email" id="newEmail" placeholder="Client Email" required><br>
                        <input type="password" id="newPassword" placeholder="Client Password" required><br>
                        <input type="text" id="newTitle" placeholder="Device Name (e.g. Living Room ESP)" required><br>
                        <button type="submit" class="authBtn">Add Client</button>
                    </form>
                    <p id="adminAddMsg" class="success-text" style="display: none;"></p>
                </div>

                <div class="form-card">
                    <h2>Add Button to Client</h2>
                    <form id="adminAddBtnForm">
                        <select id="targetClientSelect" required>
                            <option value="" disabled selected>Select Client Email</option>
                        </select><br>
                        <input type="text" id="btnNameInput" placeholder="Button Name (e.g. Lamp 1)" required><br>
                        <input type="text" id="btnPubTopic" placeholder="Publish Topic (e.g. room/lamp/set)" required><br>
                        <input type="text" id="btnSubTopic" placeholder="Subscribe Topic (e.g. room/lamp/state)" required><br>
                        <button type="submit" class="authBtn">Add Button</button>
                    </form>
                    <p id="adminAddBtnMsg" class="success-text" style="display: none;"></p>
                </div>

            </div>

            <h2 style="margin-top: 40px;">Existing Clients & Buttons</h2>
            <div id="userListContainer"></div>
        </div>

        <p class="toggle-text"><span onclick="showLoginSection()">← Back to Sign In</span></p>
    </div>

    <!-- 3. CLIENT CONTROL SECTION -->
    <div id="controlSection" style="display: none;">
        <h1 id="deviceHeader">Appliance Control</h1>
        <div id="clientButtonsContainer"></div>
    </div>

    <script>
        const broker = "broker.hivemq.com";
        const port = 8884;
        
        // Auto-detect backend port dynamically
        const API_URL = window.location.port === "5500" 
            ? "http://localhost:3000/api" 
            : "/api";

        let client = null;
        let activeAccount = null;
        let buttonStates = {}; // Stores ON/OFF states per button
        let currentAdminKey = "";

        const loginSection = document.getElementById("loginSection");
        const ownerSection = document.getElementById("ownerSection");
        const controlSection = document.getElementById("controlSection");
        const logoutBtn = document.getElementById("logoutBtn");

        // CHECK SAVED CLIENT SESSION ON LOAD
        window.addEventListener("DOMContentLoaded", () => {
            const savedUserData = localStorage.getItem("activeEspUser");
            if (savedUserData) {
                activeAccount = JSON.parse(savedUserData);
                openDashboard();
            }
        });

        // VIEW TOGGLES
        function showOwnerPanel() {
            loginSection.style.display = "none";
            ownerSection.style.display = "block";
        }

        function showLoginSection() {
            ownerSection.style.display = "none";
            loginSection.style.display = "block";
        }

        // CLIENT LOGIN
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim().toLowerCase();
            const password = document.getElementById("loginPassword").value;
            const errorMsg = document.getElementById("loginErrorMsg");

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    activeAccount = data.user;
                    localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));
                    errorMsg.style.display = "none";
                    openDashboard();
                } else {
                    errorMsg.innerText = data.message;
                    errorMsg.style.display = "block";
                }
            } catch (err) {
                errorMsg.innerText = "Cannot connect to server!";
                errorMsg.style.display = "block";
            }
        });

        // ADMIN: VERIFY KEY & LOAD USERS
        async function verifyAdminKey() {
            const keyInput = document.getElementById("adminKeyInput").value;
            const authError = document.getElementById("adminAuthError");

            try {
                const res = await fetch(`${API_URL}/admin/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey: keyInput })
                });
                const data = await res.json();

                if (data.success) {
                    currentAdminKey = keyInput;
                    authError.style.display = "none";
                    document.getElementById("adminAuthBox").style.display = "none";
                    document.getElementById("adminControls").style.display = "block";
                    renderUserList(data.users);
                    populateClientDropdown(data.users);
                } else {
                    authError.innerText = data.message;
                    authError.style.display = "block";
                }
            } catch (err) {
                authError.innerText = "Cannot connect to backend server!";
                authError.style.display = "block";
            }
        }

        // POPULATE CLIENT SELECT DROPDOWN FOR ADDING BUTTONS
        function populateClientDropdown(users) {
            const select = document.getElementById("targetClientSelect");
            select.innerHTML = '<option value="" disabled selected>Select Client Email</option>';
            users.forEach(u => {
                select.innerHTML += `<option value="${u.email}">${u.email} (${u.title})</option>`;
            });
        }

        // ADMIN: RENDER USER LIST TABLE WITH BUTTON DETAILS
        function renderUserList(users) {
            const container = document.getElementById("userListContainer");
            if (users.length === 0) {
                container.innerHTML = "<p style='color: #888;'>No clients added yet.</p>";
                return;
            }

            let html = "<table class='admin-table'><tr><th>Email / Device</th><th>Client Buttons</th><th>Action</th></tr>";
            users.forEach(u => {
                let buttonsList = "<em>No buttons added</em>";
                if (u.buttons && u.buttons.length > 0) {
                    buttonsList = u.buttons.map(b => `
                        <div style="margin: 4px 0; background: #222; padding: 4px 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">
                            <span><strong>${b.name}</strong> <small>(${b.pubTopic})</small></span>
                            <button class='deleteBtn' style='font-size:0.75rem; padding: 2px 5px;' onclick="deleteClientButton('${u.email}', '${b.id}')">X</button>
                        </div>
                    `).join('');
                }

                html += `<tr>
                    <td><strong>${u.email}</strong><br><small style="color: #aaa;">${u.title}</small></td>
                    <td style="text-align: left;">${buttonsList}</td>
                    <td><button class='deleteBtn' onclick="deleteUser('${u.email}')">Delete User</button></td>
                </tr>`;
            });
            html += "</table>";
            container.innerHTML = html;
        }

        // ADMIN: ADD USER
        document.getElementById("adminAddForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const email = document.getElementById("newEmail").value.trim().toLowerCase();
            const password = document.getElementById("newPassword").value;
            const title = document.getElementById("newTitle").value.trim();
            const msgBox = document.getElementById("adminAddMsg");

            try {
                const res = await fetch(`${API_URL}/admin/add-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey: currentAdminKey, email, password, title })
                });
                const data = await res.json();

                if (data.success) {
                    msgBox.innerText = data.message;
                    msgBox.style.display = "block";
                    document.getElementById("adminAddForm").reset();
                    verifyAdminKey(); // Refresh user list
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Server error!");
            }
        });

        // ADMIN: ADD BUTTON TO CLIENT
        document.getElementById("adminAddBtnForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const targetEmail = document.getElementById("targetClientSelect").value;
            const buttonName = document.getElementById("btnNameInput").value.trim();
            const pubTopic = document.getElementById("btnPubTopic").value.trim();
            const subTopic = document.getElementById("btnSubTopic").value.trim();
            const msgBox = document.getElementById("adminAddBtnMsg");

            try {
                const res = await fetch(`${API_URL}/admin/add-button`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey: currentAdminKey, targetEmail, buttonName, pubTopic, subTopic })
                });
                const data = await res.json();

                if (data.success) {
                    msgBox.innerText = data.message;
                    msgBox.style.display = "block";
                    document.getElementById("adminAddBtnForm").reset();
                    verifyAdminKey(); // Refresh list
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Server error!");
            }
        });

        // ADMIN: DELETE SPECIFIC BUTTON
        async function deleteClientButton(targetEmail, buttonId) {
            if (!confirm(`Are you sure you want to delete this button?`)) return;

            try {
                const res = await fetch(`${API_URL}/admin/delete-button`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey: currentAdminKey, targetEmail, buttonId })
                });
                const data = await res.json();

                if (data.success) {
                    verifyAdminKey(); // Refresh list
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Server error!");
            }
        }

        // ADMIN: DELETE USER
        async function deleteUser(email) {
            if (!confirm(`Are you sure you want to delete client: ${email}?`)) return;

            try {
                const res = await fetch(`${API_URL}/admin/delete-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey: currentAdminKey, email })
                });
                const data = await res.json();

                if (data.success) {
                    verifyAdminKey(); // Refresh list after deletion
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Server error!");
            }
        }

        // CLIENT DASHBOARD
        function openDashboard() {
            loginSection.style.display = "none";
            ownerSection.style.display = "none";
            controlSection.style.display = "block";
            logoutBtn.style.display = "block";
            document.getElementById("deviceHeader").innerText = activeAccount.title;

            renderClientButtons();
            initMqttConnection();
        }

        function renderClientButtons() {
            const container = document.getElementById("clientButtonsContainer");
            container.innerHTML = "";

            if (!activeAccount.buttons || activeAccount.buttons.length === 0) {
                container.innerHTML = "<p style='color:#888;'>No control buttons assigned to your account yet.</p>";
                return;
            }

            activeAccount.buttons.forEach(b => {
                buttonStates[b.id] = false;
                container.innerHTML += `
                    <div style="margin: 15px 0;">
                        <h3>${b.name}</h3>
                        <button id="btn_${b.id}" class="authBtn" onclick="toggleAppliance('${b.id}', '${b.pubTopic}')">Connecting...</button>
                    </div>
                `;
            });
        }

        function initMqttConnection() {
            const uniqueClientId = "web_client_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
            client = new Paho.Client(broker, Number(port), "/mqtt", uniqueClientId);
            
            client.onMessageArrived = (msg) => {
                if (activeAccount.buttons) {
                    const matchedBtn = activeAccount.buttons.find(b => b.subTopic === msg.destinationName);
                    if (matchedBtn) {
                        const state = (msg.payloadString === "1");
                        buttonStates[matchedBtn.id] = state;
                        const btnEl = document.getElementById(`btn_${matchedBtn.id}`);
                        if (btnEl) {
                            btnEl.innerText = state ? "ON" : "OFF";
                            btnEl.className = state ? "authBtn on" : "authBtn off";
                        }
                    }
                }
            };

            client.onConnectionLost = () => { 
                if (activeAccount.buttons) {
                    activeAccount.buttons.forEach(b => {
                        const btnEl = document.getElementById(`btn_${b.id}`);
                        if (btnEl) btnEl.innerText = "Reconnecting...";
                    });
                }
            };

            client.connect({
                useSSL: true,
                cleanSession: true,
                timeout: 10,
                onSuccess: () => {
                    if (activeAccount.buttons) {
                        activeAccount.buttons.forEach(b => {
                            if (b.subTopic) client.subscribe(b.subTopic);
                            const btnEl = document.getElementById(`btn_${b.id}`);
                            if (btnEl) {
                                btnEl.innerText = "OFF";
                                btnEl.className = "authBtn off";
                            }
                        });
                    }
                },
                onFailure: () => { 
                    if (activeAccount.buttons) {
                        activeAccount.buttons.forEach(b => {
                            const btnEl = document.getElementById(`btn_${b.id}`);
                            if (btnEl) btnEl.innerText = "Connection Failed";
                        });
                    }
                }
            });
        }

        function toggleAppliance(buttonId, pubTopic) {
            if (!client || !client.isConnected()) return;

            let currentState = buttonStates[buttonId] || false;
            let nextState = currentState ? "0" : "1";
            
            let message = new Paho.Message(nextState);
            message.destinationName = pubTopic;
            client.send(message);

            buttonStates[buttonId] = (nextState === "1");
            const btnEl = document.getElementById(`btn_${buttonId}`);
            if (btnEl) {
                btnEl.innerText = buttonStates[buttonId] ? "ON" : "OFF";
                btnEl.className = buttonStates[buttonId] ? "authBtn on" : "authBtn off";
            }
        }

        function logout() {
            localStorage.removeItem("activeEspUser");
            if (client && client.isConnected()) client.disconnect();
            activeAccount = null;
            
            controlSection.style.display = "none";
            logoutBtn.style.display = "none";
            loginSection.style.display = "block";
            document.getElementById("loginForm").reset();
        }
    </script>
</body>
</html>
