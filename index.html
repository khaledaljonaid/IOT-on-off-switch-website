<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Device Manager</title>
    <!-- Include QR Scanner and MQTT -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .hidden { display: none !important; }
        .sender-square {
            width: 120px; height: 120px; border: 2px solid #007BFF; border-radius: 8px;
            display: inline-flex; align-items: center; justify-content: center;
            margin: 10px; cursor: pointer; background-color: #f8f9fa; text-align: center;
            font-weight: bold; transition: 0.2s;
        }
        .sender-square:hover { background-color: #007BFF; color: white; }
        .receiver-btn {
            padding: 15px 30px; margin: 10px; cursor: pointer;
            background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px;
        }
        #reader { width: 300px; margin: 20px 0; }
    </style>
</head>
<body>

    <!-- 1. LOGIN PAGE -->
    <div id="view-login">
        <h2>Enter Email to Verify</h2>
        <input type="email" id="email-input" placeholder="email@example.com">
        <button onclick="login()">Verify & Login</button>
    </div>

    <!-- 2. SENDERS PAGE -->
    <div id="view-senders" class="hidden">
        <h2>My Senders</h2>
        <div id="senders-container"></div>
        <button onclick="startScanner('sender')">Scan QR to Add Sender</button>
    </div>

    <!-- 3. RECEIVERS PAGE -->
    <div id="view-receivers" class="hidden">
        <button onclick="switchView('view-senders')">⬅ Back to Senders</button>
        <h2 id="current-sender-title"></h2>
        <div id="receivers-container"></div>
        <button onclick="startScanner('receiver')">Scan QR to Add Receiver</button>
    </div>

    <!-- QR SCANNER OVERLAY -->
    <div id="view-scanner" class="hidden">
        <div id="reader"></div>
        <button onclick="stopScanner()">Cancel Scan</button>
    </div>

    <script>
        let currentUser = null;
        let currentSender = null;
        let scanMode = ''; 
        let html5QrcodeScanner = null;

        // --- MQTT Setup ---
        // Replace with your actual broker address and port (e.g., wss://broker.emqx.io:8084/mqtt)
        const mqttClient = new Paho.MQTT.Client("broker.emqx.io", 8084, "client_" + Math.random().toString(16).substr(2, 8));
        mqttClient.connect({ useSSL: true, onSuccess: () => console.log("MQTT Connected") });

        function switchView(viewId) {
            document.querySelectorAll('body > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        async function login() {
            const email = document.getElementById('email-input').value;
            if (!email) return alert("Enter email");

            const res = await fetch('/api/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                renderSenders();
                switchView('view-senders');
            }
        }

        // --- Senders Logic ---
        function renderSenders() {
            const container = document.getElementById('senders-container');
            container.innerHTML = '';
            currentUser.senders.forEach(sender => {
                const sq = document.createElement('div');
                sq.className = 'sender-square';
                sq.innerText = sender.name;
                sq.onclick = () => openSender(sender);
                container.appendChild(sq);
            });
        }

        function openSender(sender) {
            currentSender = sender;
            document.getElementById('current-sender-title').innerText = sender.name + " - Receivers";
            renderReceivers();
            switchView('view-receivers');
        }

        // --- Receivers Logic ---
        function renderReceivers() {
            const container = document.getElementById('receivers-container');
            container.innerHTML = '';
            currentSender.receivers.forEach(receiver => {
                const btn = document.createElement('button');
                btn.className = 'receiver-btn';
                btn.innerText = receiver.name;
                btn.onclick = () => activateReceiver(receiver);
                container.appendChild(btn);
            });
        }

        function activateReceiver(receiver) {
            // Sends command to Sender's specific subTopic
            if (!mqttClient.isConnected()) return alert("MQTT not connected yet");
            
            const payload = JSON.stringify({
                command: "toggle_and_add",
                mac: receiver.mac,
                name: receiver.name
            });

            const message = new Paho.MQTT.Message(payload);
            message.destinationName = currentSender.subTopic;
            mqttClient.send(message);
            console.log("Command sent to sender:", currentSender.id, payload);
        }

        // --- QR Scanner Logic ---
        function startScanner(mode) {
            scanMode = mode;
            switchView('view-scanner');
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: {width: 250, height: 250} }, onScanSuccess);
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    switchView(scanMode === 'sender' ? 'view-senders' : 'view-receivers');
                });
            }
        }

        async function onScanSuccess(decodedText) {
            stopScanner();
            try {
                const qrData = JSON.parse(decodedText);
                
                if (scanMode === 'sender') {
                    const name = prompt("Name this Sender device:");
                    if (!name) return switchView('view-senders');
                    
                    const res = await fetch('/api/add-sender', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ email: currentUser.email, id: qrData.id, subTopic: qrData.subTopic, name })
                    });
                    const data = await res.json();
                    if(data.success) currentUser.senders.push(data.sender);
                    renderSenders();
                    switchView('view-senders');
                } 
                else if (scanMode === 'receiver') {
                    const name = prompt("Name this Receiver:");
                    if (!name) return switchView('view-receivers');

                    const res = await fetch('/api/add-receiver', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ email: currentUser.email, senderId: currentSender.id, mac: qrData.mac, name })
                    });
                    const data = await res.json();
                    if(data.success) currentSender.receivers.push(data.receiver);
                    renderReceivers();
                    switchView('view-receivers');
                }
            } catch (e) {
                alert("Invalid QR format. Ensure it is JSON.");
                switchView(scanMode === 'sender' ? 'view-senders' : 'view-receivers');
            }
        }
    </script>
</body>
</html>
