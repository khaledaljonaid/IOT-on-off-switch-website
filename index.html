<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAD Smart Device Control</title>
    <script src="https://cdn.jsdelivr.net/npm/paho-mqtt@1.1.0/paho-mqtt.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header dir="ltr">
        <div class="logo">
            <img src="Screenshot_2026-07-18_220821-removebg-preview.png" alt="logo">
        </div>
        <div class="header-buttons">
            <button class="settings-icon-btn" id="settingsBtn" onclick="openSettingsModal()" title="Settings" style="display: none;">⚙️</button>
        </div>
    </header>

    <!-- AUTHENTICATION CONTAINER -->
    <div id="auth-container" class="auth-card">
        
        <!-- LOGIN FORM -->
        <div id="login-form">
            <h2 data-i18n="signInTitle">Sign In</h2>
            <input type="text" id="loginId" data-i18n-ph="loginIdPh" placeholder="Email or Username" required><br>
            <input type="password" id="loginPassword" data-i18n-ph="passPh" placeholder="Password" required><br>
            <button class="authBtn" onclick="login()" data-i18n="loginBtn">Login</button>
            <p class="toggle-text"><span onclick="toggleView('register-form')" data-i18n="noAccountBtn">Don't have an account? Create one</span></p>
            <p id="loginMessage" class="error-text" style="display: none;"></p>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-form" style="display: none;">
            <h2 data-i18n="registerTitle">Create Account</h2>
            <input type="email" id="regEmail" data-i18n-ph="emailPh" placeholder="Email" required><br>
            <input type="text" id="regUsername" data-i18n-ph="usernamePh" placeholder="Username" required><br>
            <input type="password" id="regPassword" data-i18n-ph="passPh" placeholder="Password" required><br>
            <button class="authBtn" onclick="register()" data-i18n="createAccBtn">Create Account</button>
            <p class="toggle-text"><span onclick="toggleView('login-form')" data-i18n="hasAccountBtn">Already have an account? Sign in</span></p>
            <p id="regMessage" class="error-text" style="display: none;"></p>
        </div>

    </div>

    <!-- SENDERS PAGE (DEVICES) -->
    <div id="sendersSection" style="display: none;">
        <h1 data-i18n="mySendersTitle">My Devices (Senders)</h1>
        <div id="senderQrReader" class="qr-box" style="display: none;"></div>
        <div id="sendersContainer" class="squares-wrapper"></div>
    </div>

    <!-- RECEIVERS PAGE (APPLIANCES) -->
    <div id="receiversSection" style="display: none;">
        <button class="small-btn back-btn" onclick="showSendersSection()" data-i18n="backToSenders">← Back to Devices</button>
        <h1 id="deviceHeader">Appliance Control</h1>
        <div id="receiverQrReader" class="qr-box" style="display: none;"></div>
        <div id="clientButtonsContainer" class="squares-wrapper"></div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="modal-overlay" style="display: none;">
        <div class="modal-content form-container settings-modal-card">
            <h2 data-i18n="settingsTitle">Settings</h2>
            <div class="settings-actions">
                <button class="authBtn lang-settings-btn" id="langToggleBtn" onclick="toggleLanguage()" dir="auto">🌐 عربي</button>
                <button class="authBtn logout-settings-btn" id="logoutBtn" onclick="logout()" data-i18n="signOut" dir="auto">Sign Out</button>
            </div>
            <button class="small-btn close-modal-btn" onclick="closeSettingsModal()" data-i18n="closeBtn">Close</button>
        </div>
    </div>

    <!-- NAME INPUT MODAL -->
    <div id="nameModal" class="modal-overlay" style="display: none;">
        <div class="modal-content form-container">
            <h2 id="modalTitle">Name Device</h2>
            <input type="text" id="modalNameInput" placeholder="Enter device name..." required><br>
            <button class="authBtn" onclick="submitNameModal()" data-i18n="saveBtn">Save</button>
            <button class="small-btn" style="margin-top: 10px;" onclick="closeNameModal()" data-i18n="cancelBtn">Cancel</button>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                langToggle: "🌐 عربي",
                signInTitle: "Login",
                registerTitle: "Create Account",
                settingsTitle: "Settings",
                loginIdPh: "Email or Username",
                emailPh: "Email",
                usernamePh: "Username",
                passPh: "Password",
                loginBtn: "Login",
                createAccBtn: "Create Account",
                noAccountBtn: "Don't have an account? Create one",
                hasAccountBtn: "Already have an account? Sign in",
                signOut: "Sign Out",
                mySendersTitle: "My Devices",
                backToSenders: "← Back to Devices",
                stateOn: "ON",
                stateOff: "OFF",
                deleteDev: "✕ Delete Device",
                addSenderCard: "+ Add Device",
                addReceiverCard: "+ Add Appliance",
                noSenders: "No devices added yet. Click + below to pair one.",
                noReceivers: "No Appliances added to this device yet. Click + below to pair one.",
                alertDelConf: "Are you sure you want to remove this item?",
                nameSenderModalTitle: "Name Your Device",
                nameReceiverModalTitle: "Name Your Appliance",
                saveBtn: "Save",
                cancelBtn: "Cancel",
                closeBtn: "Close",
                invalidQr: "Invalid QR code format."
            },
            ar: {
                langToggle: "🌐 English",
                signInTitle: "تسجيل الدخول",
                registerTitle: "إنشاء حساب",
                settingsTitle: "الإعدادات",
                loginIdPh: "البريد الإلكتروني أو اسم المستخدم",
                emailPh: "البريد الإلكتروني",
                usernamePh: "اسم المستخدم",
                passPh: "كلمة المرور",
                loginBtn: "دخول",
                createAccBtn: "إنشاء حساب",
                noAccountBtn: "ليس لديك حساب؟ أنشئ حساباً",
                hasAccountBtn: "لديك حساب بالفعل؟ سجل الدخول",
                signOut: "تسجيل الخروج",
                mySendersTitle: "أجهزتي",
                backToSenders: "العودة للأجهزة →",
                stateOn: "تشغيل",
                stateOff: "إيقاف",
                deleteDev: "✕ حذف الجهاز",
                addSenderCard: "إضافة جهاز",
                addReceiverCard: "+ إضافة جهاز استقبال",
                noSenders: "لا توجد أجهزة إرسال. اضغط على المربع + لإضافة جهاز جديد.",
                noReceivers: "لا توجد أجهزة استقبال. اضغط على المربع + لإضافة جهاز جديد.",
                alertDelConf: "هل أنت متأكد من الحذف؟",
                nameSenderModalTitle: "تسمية جهاز الإرسال",
                nameReceiverModalTitle: "تسمية جهاز الاستقبال",
                saveBtn: "حفظ",
                cancelBtn: "إلغاء",
                closeBtn: "إغلاق",
                invalidQr: "صيغة رمز QR غير صالحة."
            }
        };

        let currentLang = localStorage.getItem("preferredLang") || "en";

        function applyLanguage() {
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
            document.getElementById("langToggleBtn").innerText = translations[currentLang].langToggle;

            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (translations[currentLang][key]) el.innerText = translations[currentLang][key];
            });

            document.querySelectorAll("[data-i18n-ph]").forEach(el => {
                const key = el.getAttribute("data-i18n-ph");
                if (translations[currentLang][key]) el.placeholder = translations[currentLang][key];
            });

            if (document.getElementById("sendersSection").style.display !== "none") renderSenders();
            if (document.getElementById("receiversSection").style.display !== "none") renderReceivers();
        }

        function toggleLanguage() {
            currentLang = currentLang === "en" ? "ar" : "en";
            localStorage.setItem("preferredLang", currentLang);
            applyLanguage();
        }

        function openSettingsModal() {
            document.getElementById("settingsModal").style.display = "flex";
        }

        function closeSettingsModal() {
            document.getElementById("settingsModal").style.display = "none";
        }

        const broker = "broker.hivemq.com";
        const port = 8884;
        const API_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") 
            ? `http://${window.location.hostname}:3000/api` : `${window.location.origin}/api`;

        let client = null;
        let activeAccount = null;
        let activeSender = null;
        let buttonStates = {};
        let html5QrCodeScanner = null;
        let pendingQrData = null;
        let currentScanMode = null; 
        let holdTimer = null;
        let isHoldTriggered = false;
        let ignoreMouse = false;

        const authContainer = document.getElementById("auth-container");
        const sendersSection = document.getElementById("sendersSection");
        const receiversSection = document.getElementById("receiversSection");
        const settingsBtn = document.getElementById("settingsBtn");

        window.addEventListener("DOMContentLoaded", () => {
            applyLanguage(); 
            const savedUserData = localStorage.getItem("activeEspUser");
            if (savedUserData) {
                activeAccount = JSON.parse(savedUserData);
                openDashboard();
            }
        });

        function toggleView(viewId) {
            document.getElementById("login-form").style.display = "none";
            document.getElementById("register-form").style.display = "none";
            document.getElementById(viewId).style.display = "block";
            document.getElementById("loginMessage").style.display = "none";
            document.getElementById("regMessage").style.display = "none";
        }

        async function register() {
            const email = document.getElementById("regEmail").value.trim();
            const username = document.getElementById("regUsername").value.trim();
            const password = document.getElementById("regPassword").value;
            const msgEl = document.getElementById("regMessage");

            if (!email || !username || !password) {
                msgEl.innerText = "All fields required.";
                msgEl.style.display = "block";
                return;
            }

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, username, password })
                });
                const data = await res.json();
                if (data.success) {
                    alert("Account created! Please sign in.");
                    toggleView("login-form");
                } else {
                    msgEl.innerText = data.message;
                    msgEl.style.display = "block";
                }
            } catch (e) {
                msgEl.innerText = "Error connecting to server.";
                msgEl.style.display = "block";
            }
        }

        async function login() {
            const loginId = document.getElementById("loginId").value.trim();
            const password = document.getElementById("loginPassword").value;
            const msgEl = document.getElementById("loginMessage");

            if (!loginId || !password) {
                msgEl.innerText = "All fields required.";
                msgEl.style.display = "block";
                return;
            }

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginId, password })
                });
                const data = await res.json();
                if (data.success) {
                    activeAccount = data.user;
                    localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));
                    msgEl.style.display = "none";
                    openDashboard();
                } else {
                    msgEl.innerText = data.message;
                    msgEl.style.display = "block";
                }
            } catch (e) {
                msgEl.innerText = "Cannot connect to server!";
                msgEl.style.display = "block";
            }
        }

        function openDashboard() {
            authContainer.style.display = "none";
            receiversSection.style.display = "none";
            sendersSection.style.display = "flex";
            settingsBtn.style.display = "block";
            renderSenders();
            initMqttConnection();
        }

        function showSendersSection() {
            stopQrScanner();
            receiversSection.style.display = "none";
            sendersSection.style.display = "flex";
            activeSender = null;
            renderSenders();
        }

        function renderSenders() {
            const container = document.getElementById("sendersContainer");
            container.innerHTML = "";

            // Render active Senders
            if (activeAccount.senders && activeAccount.senders.length > 0) {
                activeAccount.senders.forEach((sender) => {
                    const card = document.createElement("div");
                    card.className = "sender-square";
                    card.innerHTML = `
                        <div class="sender-title">${sender.name}</div>
                        <div class="sender-id">${sender.id}</div>
                        <button class="delete-device-btn" onclick="event.stopPropagation(); deleteSender('${sender.id}')">${translations[currentLang].deleteDev}</button>
                    `;
                    card.onclick = () => openSenderReceivers(sender);
                    container.appendChild(card);
                });
            }

            // Render "+" Add Sender Square Card
            const addCard = document.createElement("div");
            addCard.className = "sender-square add-square-card";
            addCard.innerHTML = `
                <div class="add-plus-symbol">+</div>
                <div class="add-card-text">${translations[currentLang].addSenderCard}</div>
            `;
            addCard.onclick = () => startScanner('sender');
            container.appendChild(addCard);
        }

        function openSenderReceivers(sender) {
            stopQrScanner();
            activeSender = sender;
            sendersSection.style.display = "none";
            receiversSection.style.display = "flex";
            document.getElementById("deviceHeader").innerText = sender.name;
            renderReceivers();
        }

        async function deleteSender(senderId) {
            if (!confirm(translations[currentLang].alertDelConf)) return;
            try {
                const res = await fetch(`${API_URL}/delete-sender`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: activeAccount.email, senderId })
                });
                const data = await res.json();
                if (data.success) {
                    activeAccount.senders = data.senders;
                    localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));
                    renderSenders();
                }
            } catch (e) {}
        }

        function renderReceivers() {
            const container = document.getElementById("clientButtonsContainer");
            container.innerHTML = "";

            if (activeSender && activeSender.receivers && activeSender.receivers.length > 0) {
                activeSender.receivers.forEach((rcv) => {
                    if (!(rcv.id in buttonStates)) buttonStates[rcv.id] = false;
                    const stateText = buttonStates[rcv.id] ? translations[currentLang].stateOn : translations[currentLang].stateOff;

                    const card = document.createElement("div");
                    card.className = "device-card";
                    card.innerHTML = `
                        <h3>${rcv.name}</h3>
                        <button id="btn_${rcv.id}" class="authBtn appliance-btn" 
                                oncontextmenu="return false;"
                                onmousedown="startHold('${rcv.id}', event)" onmouseup="endHold('${rcv.id}', '${rcv.pubTopic}', event)" 
                                onmouseleave="cancelHold()" ontouchstart="startHold('${rcv.id}', event)" 
                                ontouchend="endHold('${rcv.id}', '${rcv.pubTopic}', event)" ontouchcancel="cancelHold()">
                                ${stateText}</button>
                        <button id="delBtn_${rcv.id}" class="delete-device-btn" style="display: none;" 
                                onclick="deleteReceiver('${rcv.id}')">${translations[currentLang].deleteDev}</button>
                    `;
                    container.appendChild(card);
                });
            }

            // Render "+" Add Receiver Square Card
            const addCard = document.createElement("div");
            addCard.className = "sender-square add-square-card";
            addCard.innerHTML = `
                <div class="add-plus-symbol">+</div>
                <div class="add-card-text">${translations[currentLang].addReceiverCard}</div>
            `;
            addCard.onclick = () => startScanner('receiver');
            container.appendChild(addCard);
        }

        function startHold(buttonId, e) {
            if (e && e.type === 'touchstart') ignoreMouse = true;
            if (e && e.type === 'mousedown' && ignoreMouse) return;
            isHoldTriggered = false;
            holdTimer = setTimeout(() => {
                isHoldTriggered = true;
                const delBtn = document.getElementById(`delBtn_${buttonId}`);
                if (delBtn) delBtn.style.display = (delBtn.style.display === "none") ? "block" : "none";
            }, 1000);
        }

        function endHold(buttonId, pubTopic, e) {
            if (e && e.type === 'touchend' && e.cancelable) e.preventDefault(); 
            if (e && e.type === 'mouseup' && ignoreMouse) { ignoreMouse = false; return; }
            clearTimeout(holdTimer);
            if (!isHoldTriggered) toggleAppliance(buttonId, pubTopic);
        }
        function cancelHold() { clearTimeout(holdTimer); }

        async function deleteReceiver(receiverId) {
            if (!confirm(translations[currentLang].alertDelConf)) return;
            try {
                const res = await fetch(`${API_URL}/delete-receiver`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: activeAccount.email, senderId: activeSender.id, receiverId })
                });
                const data = await res.json();
                if (data.success) {
                    activeSender.receivers = data.receivers;
                    const senderIdx = activeAccount.senders.findIndex(s => s.id === activeSender.id);
                    if (senderIdx !== -1) activeAccount.senders[senderIdx].receivers = data.receivers;
                    localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));

                    if (client && client.isConnected()) {
                        let delMsg = new Paho.Message(JSON.stringify({ receiverId }));
                        delMsg.destinationName = `esp32/${activeSender.id}/setup/delete`;
                        client.send(delMsg);
                    }

                    renderReceivers();
                }
            } catch (e) {}
        }

        function initMqttConnection() {
            const uniqueClientId = "web_client_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
            client = new Paho.Client(broker, Number(port), "/mqtt", uniqueClientId);
            
            client.onMessageArrived = (msg) => {
                if (activeAccount && activeAccount.senders) {
                    activeAccount.senders.forEach(s => {
                        if (s.receivers) {
                            const matchedRcv = s.receivers.find(r => r.subTopic === msg.destinationName);
                            if (matchedRcv) {
                                const state = (msg.payloadString === "1");
                                buttonStates[matchedRcv.id] = state;
                                const btnEl = document.getElementById(`btn_${matchedRcv.id}`);
                                if (btnEl) btnEl.innerText = state ? translations[currentLang].stateOn : translations[currentLang].stateOff;
                            }
                        }
                    });
                }
            };

            client.connect({
                useSSL: true, cleanSession: true, timeout: 10,
                onSuccess: () => {
                    if (activeAccount && activeAccount.senders) {
                        activeAccount.senders.forEach(s => {
                            if (s.receivers) {
                                s.receivers.forEach(r => {
                                    if (r.subTopic) client.subscribe(r.subTopic);
                                });
                            }
                        });
                    }
                }
            });
        }

        function toggleAppliance(buttonId, pubTopic) {
            if (!client || !client.isConnected()) return;
            let nextState = buttonStates[buttonId] ? "0" : "1";
            let message = new Paho.Message(nextState);
            message.destinationName = pubTopic;
            client.send(message);
            buttonStates[buttonId] = (nextState === "1");
            const btnEl = document.getElementById(`btn_${buttonId}`);
            if (btnEl) btnEl.innerText = buttonStates[buttonId] ? translations[currentLang].stateOn : translations[currentLang].stateOff;
        }

        function logout() {
            closeSettingsModal();
            localStorage.removeItem("activeEspUser");
            if (client && client.isConnected()) client.disconnect();
            activeAccount = null;
            activeSender = null;
            sendersSection.style.display = "none";
            receiversSection.style.display = "none";
            settingsBtn.style.display = "none";
            authContainer.style.display = "flex";
            toggleView("login-form");
        }

        function startScanner(mode) {
            currentScanMode = mode;
            const readerDivId = mode === 'sender' ? "senderQrReader" : "receiverQrReader";
            const qrDiv = document.getElementById(readerDivId);

            if (qrDiv.style.display === "none") {
                qrDiv.style.display = "block";
                html5QrCodeScanner = new Html5Qrcode(readerDivId);
                html5QrCodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onQrScanned)
                    .catch(() => alert("Camera access error"));
            } else {
                stopQrScanner();
            }
        }

        function stopQrScanner() {
            if (html5QrCodeScanner) {
                html5QrCodeScanner.stop().then(() => {
                    document.getElementById("senderQrReader").style.display = "none";
                    document.getElementById("receiverQrReader").style.display = "none";
                    html5QrCodeScanner = null;
                }).catch(() => {});
            }
        }

        function onQrScanned(decodedText) {
            stopQrScanner();
            try {
                const qrData = JSON.parse(decodedText);
                pendingQrData = qrData;
                
                if (currentScanMode === 'sender' && (qrData.id || qrData.senderId)) {
                    showNameModal(translations[currentLang].nameSenderModalTitle);
                } else if (currentScanMode === 'receiver' && qrData.mac) {
                    showNameModal(translations[currentLang].nameReceiverModalTitle);
                } else {
                    alert(translations[currentLang].invalidQr);
                }
            } catch (e) {
                alert(translations[currentLang].invalidQr);
            }
        }

        function showNameModal(titleText) {
            document.getElementById("modalTitle").innerText = titleText;
            document.getElementById("modalNameInput").value = "";
            document.getElementById("nameModal").style.display = "flex";
        }

        function closeNameModal() {
            document.getElementById("nameModal").style.display = "none";
            pendingQrData = null;
        }

        async function submitNameModal() {
            const chosenName = document.getElementById("modalNameInput").value.trim();
            if (!chosenName) return;

            if (currentScanMode === 'sender') {
                const senderId = pendingQrData.id || pendingQrData.senderId;
                try {
                    const res = await fetch(`${API_URL}/add-sender`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: activeAccount.email,
                            senderId: senderId,
                            name: chosenName
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        activeAccount.senders = data.senders;
                        localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));
                        closeNameModal();
                        renderSenders();
                    }
                } catch(e) {}
            } 
            else if (currentScanMode === 'receiver') {
                try {
                    const res = await fetch(`${API_URL}/add-receiver`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: activeAccount.email,
                            senderId: activeSender.id,
                            mac: pendingQrData.mac,
                            name: chosenName
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        const newRcv = data.receiver;
                        activeSender.receivers = data.receivers;
                        
                        const senderIdx = activeAccount.senders.findIndex(s => s.id === activeSender.id);
                        if (senderIdx !== -1) activeAccount.senders[senderIdx].receivers = data.receivers;
                        localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));

                        if (client && client.isConnected()) {
                            client.subscribe(newRcv.subTopic);
                            
                            let configMsg = new Paho.Message(JSON.stringify({
                                name: newRcv.name,
                                pubTopic: newRcv.pubTopic,
                                subTopic: newRcv.subTopic,
                                mac: newRcv.mac
                            }));
                            configMsg.destinationName = `esp32/${activeSender.id}/setup/config`;
                            client.send(configMsg);
                        }

                        closeNameModal();
                        renderReceivers();
                    }
                } catch(e) {}
            }
        }
    </script>
</body>
</html>
