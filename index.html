<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Control</title>
    <!-- Working MQTT CDN -->
    <script src="https://cdn.jsdelivr.net/npm/paho-mqtt@1.1.0/paho-mqtt.min.js"></script>
    <!-- HTML5 QR Code Reader Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional inline styles for long-press delete button */
        .device-card {
            margin: 15px auto;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .delete-device-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            margin-top: 8px;
            cursor: pointer;
            animation: fadeIn 0.2s ease-in-out;
        }

        .delete-device-btn:hover {
            background-color: #dc2626;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img style="width: 140px;" src="Screenshot_2026-07-18_220821-removebg-preview.png" alt="logo">
        </div>
        <button id="logoutBtn" onclick="logout()" style="display: none;">Sign Out</button>
    </header>

    <!-- 1. CLIENT SIGN-IN SECTION -->
    <div id="loginSection">
        <div class="form-container">
            <h1>Sign In</h1>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required><br>
                <input type="password" id="loginPassword" placeholder="Password" required><br>
                <button type="submit" class="authBtn">Login</button>
            </form>
            <p id="loginErrorMsg" class="error-text" style="display: none;">Invalid credentials!</p>
            <p class="toggle-text"><span onclick="showOwnerPanel()">Owner Portal</span></p>
        </div>
    </div>

    <!-- 2. OWNER / ADMIN PANEL -->
    <div id="ownerSection" style="display: none;">
        <h1>Owner Dashboard</h1>
        
        <div id="adminAuthBox">
            <input type="password" id="adminKeyInput" placeholder="Enter Owner Secret Key"><br>
            <button class="authBtn" onclick="verifyAdminKey()">Access Admin Panel</button>
            <p id="adminAuthError" class="error-text" style="display: none;"></p>
        </div>

        <div id="adminControls" style="display: none;">
            <div class="forms-wrapper">
                <div class="form-card">
                    <h2>Add New Client Account</h2>
                    <form id="adminAddForm">
                        <input type="email" id="newEmail" placeholder="Client Email" required><br>
                        <input type="password" id="newPassword" placeholder="Client Password" required><br>
                        <input type="text" id="newTitle" placeholder="Device Name (e.g. Living Room ESP)" required><br>
                        <button type="submit" class="authBtn">Add Client</button>
                    </form>
                    <p id="adminAddMsg" class="success-text" style="display: none;"></p>
                </div>
            </div>

            <h2 style="margin-top: 40px;">Existing Clients</h2>
            <div id="userListContainer"></div>
        </div>

        <p class="toggle-text"><span onclick="showLoginSection()">← Back to Sign In</span></p>
    </div>

    <!-- 3. CLIENT CONTROL SECTION -->
    <div id="controlSection" style="display: none;">
        <!-- Top Right Plus Scan Button -->
        <button class="scan-plus-btn" onclick="toggleQrScanner()" title="Pair Device">+</button>

        <h1 id="deviceHeader">Appliance Control</h1>
        
        <div id="qrReader" style="width: 100%; max-width: 320px; display: none; margin: 15px auto;"></div>

        <div id="clientButtonsContainer"></div>
    </div>

    <script>
        const broker = "broker.hivemq.com";
        const port = 8884;
        
        const API_URL = window.location.port === "5500" 
            ? "http://localhost:3000/api" 
            : "/api";

        let client = null;
        let activeAccount = null;
        let buttonStates = {};
        let currentAdminKey = "";
        let html5QrCodeScanner = null;
        
        // Hold Timer Variables
        let holdTimer = null;
        let isHoldTriggered = false;

        const loginSection = document.getElementById("loginSection");
        const ownerSection = document.getElementById("ownerSection");
        const controlSection = document.getElementById("controlSection");
        const logoutBtn = document.getElementById("logoutBtn");

        window.addEventListener("DOMContentLoaded", () => {
            const savedUserData = localStorage.getItem("activeEspUser");
            if (savedUserData) {
                activeAccount = JSON.parse(savedUserData);
                openDashboard();
            }
        });

        function showOwnerPanel() {
            loginSection.style.display = "none";
            ownerSection.style.display = "flex";
        }

        function showLoginSection() {
            ownerSection.style.display = "none";
            loginSection.style.display = "flex";
        }

        // LOGIN
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim().toLowerCase();
            const password = document.getElementById("loginPassword").value;
            const errorMsg = document.getElementById("loginErrorMsg");

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    activeAccount = data.user;
                    localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));
                    errorMsg.style.display = "none";
                    openDashboard();
                } else {
                    errorMsg.innerText = data.message;
                    errorMsg.style.display = "block";
                }
            } catch (err) {
                errorMsg.innerText = "Cannot connect to server!";
                errorMsg.style.display = "block";
            }
        });

        // ADMIN FUNCTIONS
        async function verifyAdminKey() {
            const keyInput = document.getElementById("adminKeyInput").value;
            const authError = document.getElementById("adminAuthError");

            try {
                const res = await fetch(`${API_URL}/admin/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey: keyInput })
                });
                const data = await res.json();

                if (data.success) {
                    currentAdminKey = keyInput;
                    authError.style.display = "none";
                    document.getElementById("adminAuthBox").style.display = "none";
                    document.getElementById("adminControls").style.display = "block";
                    renderUserList(data.users);
                } else {
                    authError.innerText = data.message;
                    authError.style.display = "block";
                }
            } catch (err) {
                authError.innerText = "Cannot connect to backend server!";
                authError.style.display = "block";
            }
        }

        function renderUserList(users) {
            const container = document.getElementById("userListContainer");
            if (users.length === 0) {
                container.innerHTML = "<p style='color: #888;'>No clients added yet.</p>";
                return;
            }

            let html = "<table class='admin-table'><tr><th>Email</th><th>Device Name</th><th>Action</th></tr>";
            users.forEach(u => {
                html += `<tr>
                    <td><strong>${u.email}</strong></td>
                    <td>${u.title}</td>
                    <td><button class='deleteBtn' onclick="deleteUser('${u.email}')">Delete User</button></td>
                </tr>`;
            });
            html += "</table>";
            container.innerHTML = html;
        }

        async function deleteUser(email) {
            if (!confirm(`Are you sure you want to delete user: ${email}?`)) return;
            try {
                const res = await fetch(`${API_URL}/admin/delete-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey: currentAdminKey, targetEmail: email })
                });
                const data = await res.json();
                if (data.success) {
                    verifyAdminKey();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Failed to delete user.");
            }
        }

        // QR SCANNER PAIRING
        async function registerNewButton(targetEmail, buttonName, pubTopic, subTopic, macAddr = "") {
            try {
                const res = await fetch(`${API_URL}/admin/add-button`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey: currentAdminKey, targetEmail, buttonName, pubTopic, subTopic, macAddr })
                });
                const data = await res.json();

                if (data.success) {
                    if (client && client.isConnected()) {
                        const configPayload = JSON.stringify({
                            name: buttonName,
                            pubTopic: pubTopic,
                            subTopic: subTopic,
                            mac: macAddr
                        });
                        let configMsg = new Paho.Message(configPayload);
                        configMsg.destinationName = "esp32/setup/config";
                        client.send(configMsg);
                    }
                    return true;
                } else {
                    alert(data.message);
                    return false;
                }
            } catch (err) {
                alert("Server error!");
                return false;
            }
        }

        function toggleQrScanner() {
            const qrDiv = document.getElementById("qrReader");
            if (qrDiv.style.display === "none") {
                qrDiv.style.display = "block";
                html5QrCodeScanner = new Html5Qrcode("qrReader");
                html5QrCodeScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 250 },
                    onQrCodeScanned
                ).catch(err => alert("Camera access error: " + err));
            } else {
                stopQrScanner();
            }
        }

        function stopQrScanner() {
            if (html5QrCodeScanner) {
                html5QrCodeScanner.stop().then(() => {
                    document.getElementById("qrReader").style.display = "none";
                });
            }
        }

        async function onQrCodeScanned(decodedText) {
            stopQrScanner();
            try {
                const qrData = JSON.parse(decodedText);
                if (qrData.pubTopic && qrData.subTopic) {
                    const success = await registerNewButton(
                        activeAccount.email,
                        qrData.name || "New Device",
                        qrData.pubTopic,
                        qrData.subTopic,
                        qrData.mac || ""
                    );
                    if (success) {
                        alert("Device paired and added successfully!");
                        window.location.reload();
                    }
                } else {
                    alert("Invalid device QR code payload format.");
                }
            } catch (e) {
                alert("Scanned QR code is not valid JSON device data.");
            }
        }

        // CLIENT DASHBOARD & MQTT SETUP
        function openDashboard() {
            loginSection.style.display = "none";
            ownerSection.style.display = "none";
            controlSection.style.display = "flex";
            logoutBtn.style.display = "block";
            document.getElementById("deviceHeader").innerText = activeAccount.title;

            renderClientButtons();
            initMqttConnection();
        }

        function renderClientButtons() {
            const container = document.getElementById("clientButtonsContainer");
            container.innerHTML = "";

            if (!activeAccount.buttons || activeAccount.buttons.length === 0) {
                container.innerHTML = "<p style='color:#888;'>No control buttons assigned. Click the + button to pair a device.</p>";
                return;
            }

            activeAccount.buttons.forEach((b, index) => {
                buttonStates[b.id] = false;
                container.innerHTML += `
                    <div class="device-card">
                        <h3>${b.name}</h3>
                        <button id="btn_${b.id}" class="authBtn appliance-btn" 
                                onmousedown="startHold('${b.id}')" 
                                onmouseup="endHold('${b.id}', '${b.pubTopic}')" 
                                onmouseleave="cancelHold()"
                                ontouchstart="startHold('${b.id}')" 
                                ontouchend="endHold('${b.id}', '${b.pubTopic}')"
                                ontouchcancel="cancelHold()">Connecting...</button>
                        <button id="delBtn_${b.id}" class="delete-device-btn" style="display: none;" 
                                onclick="deleteDevice('${b.id}', ${index})">✕ Delete Device</button>
                    </div>
                `;
            });
        }

        // HOLD GESTURE LOGIC
        function startHold(buttonId) {
            isHoldTriggered = false;
            holdTimer = setTimeout(() => {
                isHoldTriggered = true;
                const delBtn = document.getElementById(`delBtn_${buttonId}`);
                if (delBtn) {
                    delBtn.style.display = (delBtn.style.display === "none") ? "block" : "none";
                }
            }, 1000); // 1.0 second hold duration
        }

        function endHold(buttonId, pubTopic) {
            clearTimeout(holdTimer);
            if (!isHoldTriggered) {
                toggleAppliance(buttonId, pubTopic);
            }
        }

        function cancelHold() {
            clearTimeout(holdTimer);
        }

        // DELETE DEVICE FROM WEB & ESP32
        async function deleteDevice(buttonId, index) {
            if (!confirm("Are you sure you want to remove this device from web and ESP32?")) return;

            try {
                // 1. Send MQTT Delete Topic to clear device on ESP32
                if (client && client.isConnected()) {
                    const deletePayload = JSON.stringify({ action: "delete", index: index });
                    let delMsg = new Paho.Message(deletePayload);
                    delMsg.destinationName = "esp32/setup/delete";
                    client.send(delMsg);
                }

                // 2. Backend Delete API call
                const res = await fetch(`${API_URL}/client/delete-button`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: activeAccount.email, buttonId: buttonId })
                });
                const data = await res.json();

                if (data.success) {
                    activeAccount.buttons = activeAccount.buttons.filter(b => b.id !== buttonId);
                    localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));
                    renderClientButtons();
                } else {
                    alert("Failed to delete device from server.");
                }
            } catch (err) {
                alert("Error deleting device.");
            }
        }

        function initMqttConnection() {
            const uniqueClientId = "web_client_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
            client = new Paho.Client(broker, Number(port), "/mqtt", uniqueClientId);
            
            client.onMessageArrived = (msg) => {
                if (activeAccount.buttons) {
                    const matchedBtn = activeAccount.buttons.find(b => b.subTopic === msg.destinationName);
                    if (matchedBtn) {
                        const state = (msg.payloadString === "1");
                        buttonStates[matchedBtn.id] = state;
                        const btnEl = document.getElementById(`btn_${matchedBtn.id}`);
                        if (btnEl) {
                            btnEl.innerText = state ? "ON" : "OFF";
                        }
                    }
                }
            };

            client.onConnectionLost = () => { 
                if (activeAccount.buttons) {
                    activeAccount.buttons.forEach(b => {
                        const btnEl = document.getElementById(`btn_${b.id}`);
                        if (btnEl) btnEl.innerText = "Reconnecting...";
                    });
                }
            };

            client.connect({
                useSSL: true,
                cleanSession: true,
                timeout: 10,
                onSuccess: () => {
                    if (activeAccount.buttons) {
                        activeAccount.buttons.forEach(b => {
                            if (b.subTopic) client.subscribe(b.subTopic);
                            const btnEl = document.getElementById(`btn_${b.id}`);
                            if (btnEl) {
                                btnEl.innerText = "OFF";
                            }
                        });
                    }
                }
            });
        }

        function toggleAppliance(buttonId, pubTopic) {
            if (!client || !client.isConnected()) return;

            let currentState = buttonStates[buttonId] || false;
            let nextState = currentState ? "0" : "1";
            
            let message = new Paho.Message(nextState);
            message.destinationName = pubTopic;
            client.send(message);

            buttonStates[buttonId] = (nextState === "1");
            const btnEl = document.getElementById(`btn_${buttonId}`);
            if (btnEl) {
                btnEl.innerText = buttonStates[buttonId] ? "ON" : "OFF";
            }
        }

        function logout() {
            localStorage.removeItem("activeEspUser");
            if (client && client.isConnected()) client.disconnect();
            activeAccount = null;
            
            controlSection.style.display = "none";
            logoutBtn.style.display = "none";
            loginSection.style.display = "flex";
            document.getElementById("loginForm").reset();
        }
    </script>
</body>
</html>
