<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAD IoT Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/paho-mqtt@1.1.0/paho-mqtt.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header dir="ltr">
        <div class="logo">
            <img src="Screenshot_2026-07-18_220821-removebg-preview.png" alt="KAD Logo">
        </div>
        <div class="header-buttons">
            <button class="small-btn" id="langToggleBtn" onclick="toggleLanguage()" dir="auto">🌐 عربي</button>
            <button class="small-btn" id="logoutBtn" onclick="logout()" style="display: none;" data-i18n="signOut" dir="auto">Sign Out</button>
        </div>
    </header>

    <!-- 1. SIGN IN SECTION -->
    <div id="loginSection">
        <div class="form-container">
            <h1 data-i18n="signInTitle">Sign In</h1>
            <form id="loginForm">
                <input type="email" id="loginEmail" data-i18n-ph="emailPh" placeholder="Email" required><br>
                <input type="password" id="loginPassword" data-i18n-ph="passPh" placeholder="Password"><br>
                <button type="submit" class="authBtn" data-i18n="loginBtn">Login</button>
            </form>
            <p id="loginErrorMsg" class="error-text" style="display: none;" data-i18n="invalidCreds">Invalid credentials!</p>
        </div>
    </div>

    <!-- 2. SENDERS (DEVICES) SECTION -->
    <div id="sendersSection" style="display: none;">
        <button class="scan-plus-btn" onclick="startScanner('sender')" title="Add Device Sender">+</button>
        <h1 data-i18n="myDevices">My Devices</h1>
        <div id="sendersContainer" class="sender-grid"></div>
    </div>

    <!-- 3. RECEIVERS CONTROL SECTION -->
    <div id="receiversSection" style="display: none;">
        <button class="back-btn" onclick="showSendersSection()"><span data-i18n="backBtn">← Back</span></button>
        <button class="scan-plus-btn" onclick="startScanner('receiver')" title="Add Receiver">+</button>
        <h1 id="currentSenderTitle">Receiver Control</h1>
        <div id="receiversContainer" class="receiver-grid"></div>
    </div>

    <!-- SCANNER OVERLAY MODAL -->
    <div id="scannerModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2 data-i18n="scanQrTitle">Scan QR Code</h2>
            <div id="qrReader"></div>
            <button class="small-btn cancel-btn" onclick="stopQrScanner()" data-i18n="cancelBtn">Cancel</button>
        </div>
    </div>

    <!-- CUSTOM DEVICE NAME INPUT MODAL -->
    <div id="nameInputModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2 id="nameModalTitle" data-i18n="enterDevName">Enter Device Name</h2>
            <input type="text" id="customNameInput" placeholder="Name" required><br>
            <button class="authBtn" onclick="submitCustomName()" data-i18n="saveBtn">Save Device</button>
            <button class="small-btn cancel-btn" onclick="closeNameModal()" data-i18n="cancelBtn" style="margin-top:8px;">Cancel</button>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                langToggle: "🌐 عربي",
                signInTitle: "Sign In",
                emailPh: "Email",
                passPh: "Password",
                loginBtn: "Login",
                invalidCreds: "Invalid credentials!",
                signOut: "Sign Out",
                myDevices: "My Devices",
                backBtn: "← Back",
                stateOn: "ON",
                stateOff: "OFF",
                deleteDev: "✕ Delete",
                noSenders: "No device senders paired yet. Click + to add one.",
                noReceivers: "No receivers added to this sender. Click + to pair.",
                scanQrTitle: "Scan Device QR Code",
                enterDevName: "Enter Device Name",
                saveBtn: "Save",
                cancelBtn: "Cancel",
                alertDelConf: "Are you sure you want to remove this item?"
            },
            ar: {
                langToggle: "🌐 English",
                signInTitle: "تسجيل الدخول",
                emailPh: "البريد الإلكتروني",
                passPh: "كلمة المرور",
                loginBtn: "دخول",
                invalidCreds: "بيانات الاعتماد غير صالحة!",
                signOut: "تسجيل الخروج",
                myDevices: "أجهزتي",
                backBtn: "العودة →",
                stateOn: "تشغيل",
                stateOff: "إيقاف",
                deleteDev: "✕ حذف",
                noSenders: "لا توجد أجهزة مرسلة مضافة. اضغط + للإضافة.",
                noReceivers: "لا توجد أجهزة مستقبلة. اضغط + للإقران.",
                scanQrTitle: "امسح رمز QR للجهاز",
                enterDevName: "أدخل اسم الجهاز",
                saveBtn: "حفظ",
                cancelBtn: "إلغاء",
                alertDelConf: "هل أنت متأكد من حذف هذا العنصر؟"
            }
        };

        let currentLang = localStorage.getItem("preferredLang") || "en";
        const broker = "broker.hivemq.com";
        const port = 8884;
        const API_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") 
            ? `http://${window.location.hostname}:3000/api` : `${window.location.origin}/api`;

        let client = null;
        let activeAccount = null;
        let activeSender = null;
        let scanMode = "";
        let pendingQrData = null;
        let html5QrCodeScanner = null;
        let receiverStates = {};
        let holdTimer = null;
        let isHoldTriggered = false;

        function applyLanguage() {
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
            document.getElementById("langToggleBtn").innerText = translations[currentLang].langToggle;

            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (translations[currentLang][key]) el.innerText = translations[currentLang][key];
            });

            document.querySelectorAll("[data-i18n-ph]").forEach(el => {
                const key = el.getAttribute("data-i18n-ph");
                if (translations[currentLang][key]) el.placeholder = translations[currentLang][key];
            });

            if (document.getElementById("sendersSection").style.display !== "none") renderSenders();
            if (document.getElementById("receiversSection").style.display !== "none") renderReceivers();
        }

        function toggleLanguage() {
            currentLang = currentLang === "en" ? "ar" : "en";
            localStorage.setItem("preferredLang", currentLang);
            applyLanguage();
        }

        window.addEventListener("DOMContentLoaded", () => {
            applyLanguage();
            const savedUserData = localStorage.getItem("activeEspUser");
            if (savedUserData) {
                activeAccount = JSON.parse(savedUserData);
                openDashboard();
            }
        });

        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim().toLowerCase();
            const password = document.getElementById("loginPassword").value;
            const errorMsg = document.getElementById("loginErrorMsg");

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    activeAccount = data.user;
                    localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));
                    errorMsg.style.display = "none";
                    openDashboard();
                } else {
                    errorMsg.innerText = data.message; errorMsg.style.display = "block";
                }
            } catch (err) {
                errorMsg.innerText = "Cannot connect to server!"; errorMsg.style.display = "block";
            }
        });

        function openDashboard() {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("logoutBtn").style.display = "block";
            initMqttConnection();
            showSendersSection();
        }

        function showSendersSection() {
            activeSender = null;
            document.getElementById("receiversSection").style.display = "none";
            document.getElementById("sendersSection").style.display = "flex";
            renderSenders();
        }

        function showReceiversSection(sender) {
            activeSender = sender;
            document.getElementById("sendersSection").style.display = "none";
            document.getElementById("receiversSection").style.display = "flex";
            document.getElementById("currentSenderTitle").innerText = sender.name;
            renderReceivers();
        }

        function renderSenders() {
            const container = document.getElementById("sendersContainer");
            container.innerHTML = "";
            if (!activeAccount.senders || activeAccount.senders.length === 0) {
                container.innerHTML = `<p style='color:#888;'>${translations[currentLang].noSenders}</p>`;
                return;
            }

            activeAccount.senders.forEach((s) => {
                const card = document.createElement("div");
                card.className = "sender-square";
                card.innerHTML = `
                    <div class="icon">⚡</div>
                    <div class="title">${s.name}</div>
                    <button class="delete-device-btn del-sender-btn" onclick="event.stopPropagation(); deleteSender('${s.id}')">${translations[currentLang].deleteDev}</button>
                `;
                card.onclick = () => showReceiversSection(s);
                container.appendChild(card);
            });
        }

        function renderReceivers() {
            const container = document.getElementById("receiversContainer");
            container.innerHTML = "";
            if (!activeSender || !activeSender.receivers || activeSender.receivers.length === 0) {
                container.innerHTML = `<p style='color:#888;'>${translations[currentLang].noReceivers}</p>`;
                return;
            }

            activeSender.receivers.forEach((r) => {
                if (!(r.id in receiverStates)) receiverStates[r.id] = false;
                const stateText = receiverStates[r.id] ? translations[currentLang].stateOn : translations[currentLang].stateOff;

                const card = document.createElement("div");
                card.className = "device-card";
                card.innerHTML = `
                    <h3>${r.name}</h3>
                    <button id="btn_${r.id}" class="authBtn appliance-btn"
                            oncontextmenu="return false;"
                            onmousedown="startHold('${r.id}', event)" 
                            onmouseup="endHold('${r.id}', '${r.mac}', '${r.name}', event)"
                            ontouchstart="startHold('${r.id}', event)" 
                            ontouchend="endHold('${r.id}', '${r.mac}', '${r.name}', event)">
                            ${stateText}</button>
                    <button id="delBtn_${r.id}" class="delete-device-btn" style="display: none;" 
                            onclick="deleteReceiver('${r.id}')">${translations[currentLang].deleteDev}</button>
                `;
                container.appendChild(card);
            });
        }

        function startHold(id, e) {
            isHoldTriggered = false;
            holdTimer = setTimeout(() => {
                isHoldTriggered = true;
                const delBtn = document.getElementById(`delBtn_${id}`);
                if (delBtn) delBtn.style.display = (delBtn.style.display === "none") ? "block" : "none";
            }, 1000);
        }

        function endHold(id, mac, name, e) {
            clearTimeout(holdTimer);
            if (!isHoldTriggered) toggleReceiver(id, mac, name);
        }

        function toggleReceiver(id, mac, name) {
            if (!client || !client.isConnected() || !activeSender) return;
            const nextState = receiverStates[id] ? "0" : "1";

            const payload = JSON.stringify({
                action: "toggle",
                mac: mac,
                name: name,
                state: nextState === "1" ? 1 : 0
            });

            let message = new Paho.Message(payload);
            message.destinationName = `esp32/${activeSender.id}/setup/config`;
            client.send(message);

            receiverStates[id] = (nextState === "1");
            const btnEl = document.getElementById(`btn_${id}`);
            if (btnEl) btnEl.innerText = receiverStates[id] ? translations[currentLang].stateOn : translations[currentLang].stateOff;
        }

        async function deleteSender(senderId) {
            if (!confirm(translations[currentLang].alertDelConf)) return;
            try {
                const res = await fetch(`${API_URL}/client/delete-sender`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: activeAccount.email, senderId })
                });
                const data = await res.json();
                if (data.success) {
                    activeAccount.senders = activeAccount.senders.filter(s => s.id !== senderId);
                    localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));
                    renderSenders();
                }
            } catch (err) {}
        }

        async function deleteReceiver(receiverId) {
            if (!confirm(translations[currentLang].alertDelConf)) return;
            try {
                const res = await fetch(`${API_URL}/client/delete-receiver`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: activeAccount.email, senderId: activeSender.id, receiverId })
                });
                const data = await res.json();
                if (data.success) {
                    activeSender.receivers = activeSender.receivers.filter(r => r.id !== receiverId);
                    localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));
                    renderReceivers();
                }
            } catch (err) {}
        }

        function initMqttConnection() {
            const uniqueClientId = "web_client_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
            client = new Paho.Client(broker, Number(port), "/mqtt", uniqueClientId);

            client.connect({
                useSSL: true, cleanSession: true, timeout: 10,
                onSuccess: () => { console.log("MQTT Connected"); }
            });
        }

        function logout() {
            localStorage.removeItem("activeEspUser");
            if (client && client.isConnected()) client.disconnect();
            activeAccount = null;
            document.getElementById("sendersSection").style.display = "none";
            document.getElementById("receiversSection").style.display = "none";
            document.getElementById("logoutBtn").style.display = "none";
            document.getElementById("loginSection").style.display = "flex";
            document.getElementById("loginForm").reset();
        }

        function startScanner(mode) {
            scanMode = mode;
            document.getElementById("scannerModal").style.display = "flex";
            html5QrCodeScanner = new Html5Qrcode("qrReader");
            html5QrCodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 220 }, onQrScanned);
        }

        function stopQrScanner() {
            if (html5QrCodeScanner) {
                html5QrCodeScanner.stop().then(() => {
                    document.getElementById("scannerModal").style.display = "none";
                });
            } else {
                document.getElementById("scannerModal").style.display = "none";
            }
        }

        function onQrScanned(decodedText) {
            stopQrScanner();
            try {
                pendingQrData = JSON.parse(decodedText);
                document.getElementById("customNameInput").value = "";
                document.getElementById("nameInputModal").style.display = "flex";
            } catch(e) {
                alert("Invalid QR format. Expecting JSON.");
            }
        }

        function closeNameModal() {
            document.getElementById("nameInputModal").style.display = "none";
            pendingQrData = null;
        }

        async function submitCustomName() {
            const name = document.getElementById("customNameInput").value.trim();
            if (!name || !pendingQrData) return;

            if (scanMode === "sender") {
                const senderId = pendingQrData.id || ("SND-" + Date.now().toString().slice(-4));
                const res = await fetch(`${API_URL}/client/add-sender`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: activeAccount.email, senderId, senderName: name })
                });
                const data = await res.json();
                if (data.success) {
                    if (!activeAccount.senders) activeAccount.senders = [];
                    activeAccount.senders.push(data.sender);
                    localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));
                    renderSenders();
                }
            } else if (scanMode === "receiver" && activeSender) {
                const mac = pendingQrData.mac || "FF:FF:FF:FF:FF:FF";
                const res = await fetch(`${API_URL}/client/add-receiver`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: activeAccount.email, senderId: activeSender.id, mac, receiverName: name })
                });
                const data = await res.json();
                if (data.success) {
                    if (!activeSender.receivers) activeSender.receivers = [];
                    activeSender.receivers.push(data.receiver);
                    localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));
                    
                    // Transmit configuration to Sender via MQTT
                    if (client && client.isConnected()) {
                        const payload = JSON.stringify({
                            action: "add_receiver",
                            mac: mac,
                            name: name
                        });
                        let msg = new Paho.Message(payload);
                        msg.destinationName = `esp32/${activeSender.id}/setup/config`;
                        client.send(msg);
                    }
                    renderReceivers();
                }
            }
            closeNameModal();
        }
    </script>
</body>
</html>
