<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Control</title>
    <!-- Paho MQTT Client Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">🏠 Smart Home</div>
        <div class="header-buttons">
            <button class="small-btn" onclick="toggleLanguage()" id="langBtn">عربي</button>
        </div>
    </header>

    <section id="controlSection">
        <button class="scan-plus-btn" onclick="showAddDeviceForm()">+</button>
        
        <h1 id="titleText">My Devices</h1>
        
        <!-- Dummy display to show connection status -->
        <p id="mqttStatus" style="color: #888; font-size: 0.8rem;">Connecting to MQTT...</p>

        <!-- Device Card displaying correct language -->
        <div id="deviceList" class="device-card hidden">
            <h2 id="displayDeviceName"></h2>
        </div>

        <!-- Add Device Form (Simulating QR Code Data) -->
        <div class="form-container hidden" id="addDeviceForm">
            <h2 id="formTitleText">Add New Device</h2>
            <input type="text" id="devNameEn" placeholder="Device Name (English)" value="Lamp">
            <input type="text" id="devNameAr" placeholder="Device Name (Arabic)" value="مصباح">
            <input type="text" id="devPub" placeholder="Publish Topic" value="room/lamp/set">
            <input type="text" id="devSub" placeholder="Subscribe Topic" value="room/lamp/state">
            <input type="text" id="devMac" placeholder="MAC Address" value="AA:BB:CC:DD:EE:FF">
            <button class="authBtn" onclick="sendDeviceData()" id="submitBtnText">Add via MQTT</button>
        </div>
    </section>

    <script>
        let currentLang = 'en';
        let latestDeviceData = null;

        // MQTT Client Setup
        const mqttServer = "broker.hivemq.com";
        const mqttPort = 8000; // WebSocket port for HiveMQ
        const setupTopic = "esp32/setup/config";
        
        const clientId = "WebClient-" + Math.random().toString(16).substr(2, 8);
        const client = new Paho.MQTT.Client(mqttServer, mqttPort, clientId);

        client.onConnectionLost = function(responseObject) {
            document.getElementById("mqttStatus").innerText = (currentLang === 'en') ? "Disconnected" : "غير متصل";
            document.getElementById("mqttStatus").style.color = "#ef4444";
        };

        client.connect({
            onSuccess: function() {
                document.getElementById("mqttStatus").innerText = (currentLang === 'en') ? "MQTT Connected" : "متصل بالخادم";
                document.getElementById("mqttStatus").style.color = "rgb(0, 162, 255)";
            }
        });

        function showAddDeviceForm() {
            document.getElementById('addDeviceForm').classList.toggle('hidden');
        }

        // Simulate reading QR code and sending payload to ESP32
        function sendDeviceData() {
            const nameEn = document.getElementById('devNameEn').value;
            const nameAr = document.getElementById('devNameAr').value;
            const pub = document.getElementById('devPub').value;
            const sub = document.getElementById('devSub').value;
            const mac = document.getElementById('devMac').value;

            // Store it locally just to show on the website UI
            latestDeviceData = { nameEn, nameAr };
            
            // Format identical to what ESP32 JSON parser expects
            const payload = JSON.stringify({
                nameEn: nameEn,
                nameAr: nameAr,
                pubTopic: pub,
                subTopic: sub,
                mac: mac
            });

            // Send via MQTT
            const message = new Paho.MQTT.Message(payload);
            message.destinationName = setupTopic;
            client.send(message);

            // Update UI
            document.getElementById('addDeviceForm').classList.add('hidden');
            document.getElementById('deviceList').classList.remove('hidden');
            updateUI();
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'en') ? 'ar' : 'en';
            
            // Flip the entire layout direction
            document.documentElement.dir = (currentLang === 'ar') ? 'rtl' : 'ltr';
            updateUI();
        }

        function updateUI() {
            if (currentLang === 'ar') {
                document.getElementById('langBtn').innerText = "English";
                document.getElementById('titleText').innerText = "أجهزتي";
                document.getElementById('formTitleText').innerText = "إضافة جهاز جديد";
                document.getElementById('submitBtnText').innerText = "إضافة عبر MQTT";
                
                document.getElementById('devNameEn').placeholder = "اسم الجهاز (إنجليزي)";
                document.getElementById('devNameAr').placeholder = "اسم الجهاز (عربي)";
                document.getElementById('devPub').placeholder = "موضوع النشر (Publish)";
                document.getElementById('devSub').placeholder = "موضوع الاشتراك (Subscribe)";
                document.getElementById('devMac').placeholder = "عنوان MAC";

                if(client.isConnected()) {
                    document.getElementById("mqttStatus").innerText = "متصل بالخادم";
                }
                
                if(latestDeviceData) {
                    document.getElementById('displayDeviceName').innerText = latestDeviceData.nameAr;
                }
            } else {
                document.getElementById('langBtn').innerText = "عربي";
                document.getElementById('titleText').innerText = "My Devices";
                document.getElementById('formTitleText').innerText = "Add New Device";
                document.getElementById('submitBtnText').innerText = "Add via MQTT";
                
                document.getElementById('devNameEn').placeholder = "Device Name (English)";
                document.getElementById('devNameAr').placeholder = "Device Name (Arabic)";
                document.getElementById('devPub').placeholder = "Publish Topic";
                document.getElementById('devSub').placeholder = "Subscribe Topic";
                document.getElementById('devMac').placeholder = "MAC Address";

                if(client.isConnected()) {
                    document.getElementById("mqttStatus").innerText = "MQTT Connected";
                }

                if(latestDeviceData) {
                    document.getElementById('displayDeviceName').innerText = latestDeviceData.nameEn;
                }
            }
        }
    </script>
</body>
</html>
