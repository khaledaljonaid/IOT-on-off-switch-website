<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo"><img style="width: 200px;" src="Screenshot_2026-07-18_220821-removebg-preview.png" alt="logo"></div>
    </header>

    <h1>Appliance Control</h1>
    
    <button id="applianceBtn" onclick="toggleAppliance()">Connecting...</button>

    <script>
        // --- PUBLIC MQTT CONFIGURATION ---
        const broker = "broker.hivemq.com";
        const port = 8884; 
        const pubTopic = "my_secret_esp32_project_12345/set";
        const subTopic = "my_secret_esp32_project_12345/state";

        let isOn = false;
        const btn = document.getElementById("applianceBtn");

        client = new Paho.MQTT.Client(broker, Number(port), "/mqtt", "web_client_" + parseInt(Math.random() * 100));
        client.onMessageArrived = onMessageArrived;
        
        client.connect({
            useSSL: true,
            onSuccess: onConnect,
            onFailure: (err) => {
                console.log("Connection failed: " + err.errorMessage);
                btn.innerText = "Connection Failed";
            }
        });

        function onConnect() {
            console.log("Connected to Public Broker");
            client.subscribe(subTopic);
            btn.innerText = "OFF";
            btn.className = "off";
        }

        function toggleAppliance() {
            // 1. Determine what the next state should be
            let nextState = isOn ? "0" : "1";
            
            // 2. Send command to broker
            message = new Paho.MQTT.Message(nextState);
            message.destinationName = pubTopic;
            client.send(message);

            // 3. OPTIMISTIC UPDATE: Change button immediately so it never feels stuck
            isOn = (nextState === "1");
            btn.innerText = isOn ? "OFF" : "ON";
            btn.className = isOn ? "off" : "on";
        }

        // This keeps it synced if the physical button is pressed
        function onMessageArrived(message) {
            isOn = (message.payloadString === "1");
            btn.innerText = isOn ? "OFF" : "ON";
            btn.className = isOn ? "off" : "on";
        }
    </script>
</body>
</html>
