<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Control</title>
    <!-- Working MQTT CDN -->
    <script src="https://cdn.jsdelivr.net/npm/paho-mqtt@1.1.0/paho-mqtt.min.js"></script>
    <!-- HTML5 QR Code Reader Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }

        body { 
            margin: 0;  
            background-color: black;
            color: white;
            font-family: sans-serif; 
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            width: 100%;
        }

        .logo img {
            width: 140px;
            height: auto;
        }

        /* Sections */
        #loginSection {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            padding-top: 40px;
            width: 100%;
        }

        #ownerSection, #controlSection {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            width: 100%;
            position: relative;
        }

        .form-container {
            width: 100%;
            max-width: 320px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.3rem;
        }

        /* Form Controls */
        #loginSection input, #ownerSection input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #111;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        /* Generic Auth Button */
        .authBtn {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            margin-top: 10px;
            background-color: rgb(0, 162, 255);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        /* On/Off Appliance Buttons Always rgb(0, 162, 255) */
        .appliance-btn {
            background-color: rgb(0, 162, 255) !important;
            user-select: none; /* Prevents text selection on hold */
            -webkit-user-select: none;
        }

        /* Smaller Sign Out Button */
        #logoutBtn {
            width: auto;
            padding: 6px 12px;
            font-size: 0.8rem;
            background-color: #222;
            color: #ccc;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            font-weight: normal;
        }

        #logoutBtn:hover {
            background-color: #333;
            color: white;
        }

        /* Plus Sign Scan Button at Top Right */
        .scan-plus-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 42px;
            height: 42px;
            background-color: rgb(0, 162, 255);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.8rem;
            font-weight: bold;
            line-height: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0px 2px 8px rgba(0, 162, 255, 0.4);
            transition: transform 0.1s ease;
        }

        .scan-plus-btn:active {
            transform: scale(0.92);
        }

        .authBtn:hover {
            opacity: 0.9;
        }

        .error-text {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .success-text {
            color: #22c55e;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .toggle-text {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #888;
        }

        .toggle-text span {
            color: rgb(0, 162, 255);
            cursor: pointer;
            text-decoration: underline;
        }

        .forms-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            flex-wrap: wrap;
            margin: 20px auto;
            width: 100%;
            max-width: 400px;
        }

        .form-card {
            flex: 1;
            min-width: 280px;
            max-width: 380px;
            width: 100%;
        }

        /* Admin Table */
        .admin-table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 100%;
            max-width: 500px;
            background-color: #111;
        }

        .admin-table th, .admin-table td {
            border: 1px solid #333;
            padding: 10px;
            font-size: 0.85rem;
        }

        .admin-table th {
            background-color: #222;
            color: rgb(0, 162, 255);
        }

        .deleteBtn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .deleteBtn:hover {
            background-color: #dc2626;
        }

        .device-card {
            margin: 15px auto;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .delete-device-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            margin-top: 8px;
            cursor: pointer;
            animation: fadeIn 0.2s ease-in-out;
        }

        .delete-device-btn:hover {
            background-color: #dc2626;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img style="width: 140px;" src="Screenshot_2026-07-18_220821-removebg-preview.png" alt="logo">
        </div>
        <button id="logoutBtn" onclick="logout()" style="display: none;">Sign Out</button>
    </header>

    <!-- 1. CLIENT SIGN-IN SECTION -->
    <div id="loginSection">
        <div class="form-container">
            <h1>Sign In</h1>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required><br>
                <input type="password" id="loginPassword" placeholder="Password" required><br>
                <button type="submit" class="authBtn">Login</button>
            </form>
            <p id="loginErrorMsg" class="error-text" style="display: none;">Invalid credentials!</p>
            <p class="toggle-text"><span onclick="showOwnerPanel()">Owner Portal</span></p>
        </div>
    </div>

    <!-- 2. OWNER / ADMIN PANEL -->
    <div id="ownerSection" style="display: none;">
        <h1>Owner Dashboard</h1>
        
        <div id="adminAuthBox">
            <input type="password" id="adminKeyInput" placeholder="Enter Owner Secret Key"><br>
            <button class="authBtn" onclick="verifyAdminKey()">Access Admin Panel</button>
            <p id="adminAuthError" class="error-text" style="display: none;"></p>
        </div>

        <div id="adminControls" style="display: none;">
            <div class="forms-wrapper">
                <div class="form-card">
                    <h2>Add New Client Account</h2>
                    <form id="adminAddForm">
                        <input type="email" id="newEmail" placeholder="Client Email" required><br>
                        <input type="password" id="newPassword" placeholder="Client Password" required><br>
                        <input type="text" id="newTitle" placeholder="Device Name (e.g. Living Room ESP)" required><br>
                        <button type="submit" class="authBtn">Add Client</button>
                    </form>
                    <p id="adminAddMsg" style="display: none; margin-top: 10px;"></p>
                </div>
            </div>

            <h2 style="margin-top: 40px;">Existing Clients</h2>
            <div id="userListContainer"></div>
        </div>

        <p class="toggle-text"><span onclick="showLoginSection()">← Back to Sign In</span></p>
    </div>

    <!-- 3. CLIENT CONTROL SECTION -->
    <div id="controlSection" style="display: none;">
        <button class="scan-plus-btn" onclick="toggleQrScanner()" title="Pair Device">+</button>

        <h1 id="deviceHeader">Appliance Control</h1>
        
        <div id="qrReader" style="width: 100%; max-width: 320px; display: none; margin: 15px auto;"></div>

        <div id="clientButtonsContainer"></div>
    </div>

    <script>
        const broker = "broker.hivemq.com";
        const port = 8884;
        
        const API_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") 
            ? `http://${window.location.hostname}:3000/api` 
            : `${window.location.origin}/api`;

        let client = null;
        let activeAccount = null;
        let buttonStates = {};
        let currentAdminKey = "";
        let html5QrCodeScanner = null;
        
        let holdTimer = null;
        let isHoldTriggered = false;
        let ignoreMouse = false; // Prevents ghost clicks on mobile

        const loginSection = document.getElementById("loginSection");
        const ownerSection = document.getElementById("ownerSection");
        const controlSection = document.getElementById("controlSection");
        const logoutBtn = document.getElementById("logoutBtn");

        window.addEventListener("DOMContentLoaded", () => {
            const savedUserData = localStorage.getItem("activeEspUser");
            if (savedUserData) {
                activeAccount = JSON.parse(savedUserData);
                openDashboard();
            }
        });

        function showOwnerPanel() {
            loginSection.style.display = "none";
            ownerSection.style.display = "flex";
        }

        function showLoginSection() {
            ownerSection.style.display = "none";
            loginSection.style.display = "flex";
        }

        // LOGIN
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim().toLowerCase();
            const password = document.getElementById("loginPassword").value;
            const errorMsg = document.getElementById("loginErrorMsg");

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    activeAccount = data.user;
                    localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));
                    errorMsg.style.display = "none";
                    openDashboard();
                } else {
                    errorMsg.innerText = data.message;
                    errorMsg.style.display = "block";
                }
            } catch (err) {
                errorMsg.innerText = "Cannot connect to server!";
                errorMsg.style.display = "block";
            }
        });

        // ADMIN FUNCTIONS
        async function verifyAdminKey() {
            const keyInput = document.getElementById("adminKeyInput").value;
            const authError = document.getElementById("adminAuthError");

            try {
                const res = await fetch(`${API_URL}/admin/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey: keyInput })
                });
                const data = await res.json();

                if (data.success) {
                    currentAdminKey = keyInput;
                    authError.style.display = "none";
                    document.getElementById("adminAuthBox").style.display = "none";
                    document.getElementById("adminControls").style.display = "block";
                    renderUserList(data.users);
                } else {
                    authError.innerText = data.message;
                    authError.style.display = "block";
                }
            } catch (err) {
                authError.innerText = "Cannot connect to backend server!";
                authError.style.display = "block";
            }
        }

        document.getElementById("adminAddForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const email = document.getElementById("newEmail").value.trim();
            const password = document.getElementById("newPassword").value;
            const title = document.getElementById("newTitle").value.trim();
            const msgEl = document.getElementById("adminAddMsg");

            try {
                const res = await fetch(`${API_URL}/admin/add-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey: currentAdminKey, email, password, title })
                });
                const data = await res.json();

                if (data.success) {
                    msgEl.innerText = data.message;
                    msgEl.style.color = "#22c55e";
                    msgEl.style.display = "block";
                    document.getElementById("adminAddForm").reset();
                    verifyAdminKey();
                } else {
                    msgEl.innerText = data.message;
                    msgEl.style.color = "#ef4444";
                    msgEl.style.display = "block";
                }
            } catch (err) {
                msgEl.innerText = "Error adding client!";
                msgEl.style.color = "#ef4444";
                msgEl.style.display = "block";
            }
        });

        function renderUserList(users) {
            const container = document.getElementById("userListContainer");
            if (!users || users.length === 0) {
                container.innerHTML = "<p style='color: #888;'>No clients added yet.</p>";
                return;
            }

            let html = "<table class='admin-table'><tr><th>Email</th><th>Device Name</th><th>Action</th></tr>";
            users.forEach(u => {
                html += `<tr>
                    <td><strong>${u.email}</strong></td>
                    <td>${u.title}</td>
                    <td><button class='deleteBtn' onclick="deleteUser('${u.email}')">Delete User</button></td>
                </tr>`;
            });
            html += "</table>";
            container.innerHTML = html;
        }

        async function deleteUser(email) {
            if (!confirm(`Are you sure you want to delete user: ${email}?`)) return;
            try {
                const res = await fetch(`${API_URL}/admin/delete-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey: currentAdminKey, targetEmail: email })
                });
                const data = await res.json();
                if (data.success) {
                    verifyAdminKey();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Failed to delete user.");
            }
        }

        // QR SCANNER PAIRING
        async function registerNewButton(targetEmail, buttonName, pubTopic, subTopic, macAddr = "") {
            try {
                const res = await fetch(`${API_URL}/admin/add-button`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ targetEmail, buttonName, pubTopic, subTopic, macAddr })
                });
                const data = await res.json();

                if (data.success) {
                    if (!activeAccount.buttons) activeAccount.buttons = [];
                    
                    const existingIdx = activeAccount.buttons.findIndex(b => b.id === data.button.id);
                    if (existingIdx !== -1) {
                        activeAccount.buttons[existingIdx] = data.button;
                    } else {
                        activeAccount.buttons.push(data.button);
                    }
                    localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));

                    if (client && client.isConnected()) {
                        if (data.button.subTopic) client.subscribe(data.button.subTopic);

                        const configPayload = JSON.stringify({
                            name: buttonName,
                            pubTopic: pubTopic,
                            subTopic: subTopic,
                            mac: macAddr
                        });
                        let configMsg = new Paho.Message(configPayload);
                        configMsg.destinationName = "esp32/setup/config";
                        client.send(configMsg);
                    }

                    renderClientButtons();
                    return true;
                } else {
                    alert(data.message);
                    return false;
                }
            } catch (err) {
                alert("Server error connecting to backend.");
                return false;
            }
        }

        function toggleQrScanner() {
            const qrDiv = document.getElementById("qrReader");
            if (qrDiv.style.display === "none") {
                qrDiv.style.display = "block";
                html5QrCodeScanner = new Html5Qrcode("qrReader");
                html5QrCodeScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 250 },
                    onQrCodeScanned
                ).catch(err => alert("Camera access error: " + err));
            } else {
                stopQrScanner();
            }
        }

        function stopQrScanner() {
            if (html5QrCodeScanner) {
                html5QrCodeScanner.stop().then(() => {
                    document.getElementById("qrReader").style.display = "none";
                });
            }
        }

        async function onQrCodeScanned(decodedText) {
            stopQrScanner();
            try {
                const qrData = JSON.parse(decodedText);
                
                const deviceName = qrData.deviceName || qrData.name || qrData.title || qrData.device || "Appliance";
                const macAddress = qrData.mac || qrData.macAddr || "FF:FF:FF:FF:FF:FF";

                if (qrData.pubTopic && qrData.subTopic) {
                    const success = await registerNewButton(
                        activeAccount.email,
                        deviceName,
                        qrData.pubTopic,
                        qrData.subTopic,
                        macAddress
                    );
                    if (success) {
                        alert(`Device "${deviceName}" paired successfully!`);
                    }
                } else {
                    alert("Invalid QR code! Missing required MQTT topics.");
                }
            } catch (e) {
                alert("Scanned QR code is not valid JSON device data.");
            }
        }

        // CLIENT DASHBOARD & MQTT SETUP
        function openDashboard() {
            loginSection.style.display = "none";
            ownerSection.style.display = "none";
            controlSection.style.display = "flex";
            logoutBtn.style.display = "block";
            document.getElementById("deviceHeader").innerText = activeAccount.title;

            renderClientButtons();
            initMqttConnection();
        }

        function renderClientButtons() {
            const container = document.getElementById("clientButtonsContainer");
            container.innerHTML = "";

            if (!activeAccount.buttons || activeAccount.buttons.length === 0) {
                container.innerHTML = "<p style='color:#888;'>No control buttons assigned. Click the + button to pair a device.</p>";
                return;
            }

            activeAccount.buttons.forEach((b, index) => {
                if (!(b.id in buttonStates)) {
                    buttonStates[b.id] = false;
                }
                
                // FIXED: Event handlers now pass 'event' and block context menus
                container.innerHTML += `
                    <div class="device-card">
                        <h3>${b.name}</h3>
                        <button id="btn_${b.id}" class="authBtn appliance-btn" 
                                oncontextmenu="return false;"
                                onmousedown="startHold('${b.id}', event)" 
                                onmouseup="endHold('${b.id}', '${b.pubTopic}', event)" 
                                onmouseleave="cancelHold()"
                                ontouchstart="startHold('${b.id}', event)" 
                                ontouchend="endHold('${b.id}', '${b.pubTopic}', event)"
                                ontouchcancel="cancelHold()">${buttonStates[b.id] ? "ON" : "OFF"}</button>
                        <button id="delBtn_${b.id}" class="delete-device-btn" style="display: none;" 
                                onclick="deleteDevice('${b.id}', ${index})">✕ Delete Device</button>
                    </div>
                `;
            });
        }

        // FIXED: Touch / Mouse separation logic
        function startHold(buttonId, e) {
            // Prioritize touch over mouse to prevent duplicate firing
            if (e && e.type === 'touchstart') ignoreMouse = true;
            if (e && e.type === 'mousedown' && ignoreMouse) return;

            isHoldTriggered = false;
            holdTimer = setTimeout(() => {
                isHoldTriggered = true;
                const delBtn = document.getElementById(`delBtn_${buttonId}`);
                if (delBtn) {
                    delBtn.style.display = (delBtn.style.display === "none") ? "block" : "none";
                }
            }, 1000);
        }

        function endHold(buttonId, pubTopic, e) {
            // If it's a touch screen, stop the browser from making a fake mouse click
            if (e && e.type === 'touchend') {
                if (e.cancelable) e.preventDefault(); 
            }
            // If touch already handled this, ignore the following mouseup
            if (e && e.type === 'mouseup' && ignoreMouse) {
                ignoreMouse = false;
                return;
            }

            clearTimeout(holdTimer);
            if (!isHoldTriggered) {
                toggleAppliance(buttonId, pubTopic);
            }
        }

        function cancelHold() {
            clearTimeout(holdTimer);
        }

        async function deleteDevice(buttonId, index, isFromESP32 = false) {
            // Only ask for confirmation if the user clicked delete on the website
            if (!isFromESP32) {
                if (!confirm("Are you sure you want to remove this device from web and ESP32?")) return;
            }

            try {
                // Only send MQTT message if deleting FROM the website UI
                if (!isFromESP32 && client && client.isConnected()) {
                    const deletePayload = JSON.stringify({ index: index });
                    let delMsg = new Paho.Message(deletePayload);
                    delMsg.destinationName = "esp32/setup/delete";
                    client.send(delMsg);
                }

                const res = await fetch(`${API_URL}/client/delete-button`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: activeAccount.email, buttonId: buttonId })
                });
                const data = await res.json();

                if (data.success) {
                    activeAccount.buttons = activeAccount.buttons.filter(b => b.id !== buttonId);
                    localStorage.setItem("activeEspUser", JSON.stringify(activeAccount));
                    renderClientButtons();
                    
                    // Alert the user if the ESP32 deleted it
                    if (isFromESP32) {
                        alert("Device deleted via ESP32 hardware button.");
                    }
                } else {
                    if (!isFromESP32) alert("Failed to delete device from server.");
                }
            } catch (err) {
                if (!isFromESP32) alert("Error deleting device.");
            }
        }
        function initMqttConnection() {
            const uniqueClientId = "web_client_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
            client = new Paho.Client(broker, Number(port), "/mqtt", uniqueClientId);
            
            client.onMessageArrived = (msg) => {
                // Check if the message is a delete command from the ESP32
                if (msg.destinationName === "esp32/setup/delete") {
                    try {
                        const payload = JSON.parse(msg.payloadString);
                        // If it came from the ESP32 and has a valid index
                        if (payload.source === "esp32" && payload.index >= 0) {
                            if (activeAccount.buttons && activeAccount.buttons[payload.index]) {
                                const buttonId = activeAccount.buttons[payload.index].id;
                                // Delete silently without user confirmation
                                deleteDevice(buttonId, payload.index, true); 
                            }
                        }
                    } catch(e) {}
                    return; 
                }

                // Normal on/off button toggling
                if (activeAccount.buttons) {
                    const matchedBtn = activeAccount.buttons.find(b => b.subTopic === msg.destinationName);
                    if (matchedBtn) {
                        const state = (msg.payloadString === "1");
                        buttonStates[matchedBtn.id] = state;
                        const btnEl = document.getElementById(`btn_${matchedBtn.id}`);
                        if (btnEl) {
                            btnEl.innerText = state ? "ON" : "OFF";
                        }
                    }
                }
            };
            
            client.onConnectionLost = () => { 
                if (activeAccount.buttons) {
                    activeAccount.buttons.forEach(b => {
                        const btnEl = document.getElementById(`btn_${b.id}`);
                        if (btnEl) btnEl.innerText = "Reconnecting...";
                    });
                }
            };

            client.connect({
                useSSL: true,
                cleanSession: true,
                timeout: 10,
                onSuccess: () => {
                    // Tell the website to listen for delete commands!
                    client.subscribe("esp32/setup/delete");

                    if (activeAccount.buttons) {
                        activeAccount.buttons.forEach(b => {
                            if (b.subTopic) client.subscribe(b.subTopic);
                            const btnEl = document.getElementById(`btn_${b.id}`);
                            if (btnEl) {
                                btnEl.innerText = buttonStates[b.id] ? "ON" : "OFF";
                            }
                        });
                    }
                }
            });

        function toggleAppliance(buttonId, pubTopic) {
            if (!client || !client.isConnected()) return;

            let currentState = buttonStates[buttonId] || false;
            let nextState = currentState ? "0" : "1";
            
            let message = new Paho.Message(nextState);
            message.destinationName = pubTopic;
            client.send(message);

            buttonStates[buttonId] = (nextState === "1");
            const btnEl = document.getElementById(`btn_${buttonId}`);
            if (btnEl) {
                btnEl.innerText = buttonStates[buttonId] ? "ON" : "OFF";
            }
        }

        function logout() {
            localStorage.removeItem("activeEspUser");
            if (client && client.isConnected()) client.disconnect();
            activeAccount = null;
            
            controlSection.style.display = "none";
            logoutBtn.style.display = "none";
            loginSection.style.display = "flex";
            document.getElementById("loginForm").reset();
        }
    </script>
</body>
</html>
